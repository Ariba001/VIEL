[project]
name = "viel"
version = "0.1.0"
description = "Vulnerability Intelligence and Exploit Learning — binary vulnerability detection using static analysis and ML"
requires-python = ">=3.10"
dependencies = [
    "angr",
    "capstone",
    "lief",
    "networkx",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
    "seaborn>=0.13.2",
    "pyelftools>=0.32",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "rich>=14.3.3",
    "torch",
    "torch_geometric",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
viel-generate  = "scripts.generate_dataset:main"
viel-opcodes   = "scripts.extract_opcodes:main"
viel-ghidra    = "analysis.autoghidra.execute:run_analysis"
viel           = "predict:main"

[tool.hatch.build.targets.wheel]
packages = ["analysis", "ml", "scripts"]
include = ["predict.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
